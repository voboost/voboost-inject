[package]
name = "voboost-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared verified contracts for Voboost privileged binaries"

[lib]
path = "lib.rs"

[dependencies]
voboost-contract-core = { path = "../common/contracts" }
anyhow = "1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hex = "0.4"
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

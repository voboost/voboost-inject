[package]
name = "voboost-contract-core"
version = "1.0.0"
edition = "2021"
license.workspace = true
description = "OS-independent authenticated Voboost domain contracts"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
semver = { version = "=1.0.28", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }

[package]
name = "voboost-cluster-native"
version = "1.0.0"
edition = "2021"
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
voboost-contract-core = { path = "../../common/contracts" }
libc = { version = "=0.2.189", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "=3.27.0"

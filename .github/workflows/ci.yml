name: ci

on: [push, pull_request]

# Least privilege: checkout-only workflow.
permissions:
  contents: read

# Cancel a run superseded by a newer push to the same ref so consecutive
# pushes don't queue up. Deliberately NOT applied to the release workflow —
# never cancel a release mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the new toolchain's provisioned state: the Cargo registry/index
      # and the built target/ prefix. Keyed on rust-toolchain.toml + Cargo.lock
      # (ci-pipeline: cache keyed on the new pins, not frida wraps).
      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'daemon/Cargo.toml') }}

      # Provision exactly like a developer. make init installs the OS packages,
      # the Rust toolchain (from rust-toolchain.toml), cargo-ndk, verifies NDK
      # r29, and generates the dev keypair. No frida/meson/vala.
      - name: Provision (make init)
        run: make init

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Validation host build (cargo) for the new stack. The device (arm64)
      # cross-build runs only in the release workflow.
      - name: Build (host)
        run: make build

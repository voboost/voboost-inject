name: release

on:
  push:
    tags:
      - 'v*'

# Least privilege: checkout needs contents:read; upload-artifact@v4 needs
# actions:write to attach the artifact to the workflow run.
permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'daemon/Cargo.toml') }}

      - name: Provision (make init)
        run: make init

      # CI gate (ci-versioning): Cargo.toml [package].version is the single
      # source of truth (baseline 1.0.0-beta1). Fail fast — before the NDK
      # setup and cross-build — if the tag does not match v$version. No signing
      # or publishing happens on a mismatch.
      - name: Validate version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          tag="${GITHUB_REF_NAME}"
          echo "Cargo.toml version: $version"
          echo "tag: $tag"
          test "v$version" = "$tag" || {
            echo "tag $tag does not match Cargo.toml version v$version" >&2
            exit 1
          }

      # Self-gate: ci.yml and release.yml are independent workflows (both fire
      # on a tag push), so the release re-runs make lint and make test before
      # building — a tag cannot bypass the quality gates and publish a red commit.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Android NDK r29 for the native artifacts (ndk-build) and the daemon
      # cross-build (cargo-ndk). make init verifies its presence locally; CI
      # provisions it here. r29 is required (LSPlant C++23 modules fail on r27).
      #
      # SHA-pinned (not @v1): this third-party action runs in the workflow that
      # handles SIGNING_KEY, so its supply chain is pinned to an immutable commit.
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r29

      # Expose the NDK to the cross-build: ANDROID_NDK_HOME/ROOT for tooling,
      # and the LLVM prebuilt bin on $GITHUB_PATH so the cross-compiler and
      # llvm-strip resolve in later steps (ci-signing task 1.3).
      - name: Put NDK toolchain on PATH
        run: |
          ndk="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Cross-build the full new stack: native artifacts (injector
      # libinjector.a + implant libimplant.so per ABI via ndk-build, LTO
      # disabled — ci-signing task 1.2) and the daemon ELF via cargo-ndk
      # (aarch64-linux-android). No meson, no frida (ci-signing task 1.1).
      - name: Build device artifacts (arm64 + native payload)
        run: make build-android

      # Strip the daemon ELF for the published artifact. cargo-ndk's release
      # build leaves the symbol table in; the release artifact is stripped.
      # llvm-strip is on PATH from setup-ndk.
      - name: Strip daemon ELF
        run: llvm-strip daemon/target/aarch64-linux-android/release/voboost-inject

      # Build the signed inject payload: the stripped daemon ELF carrying an
      # appended ed25519 signature in trailing bytes (VOBSIG1 magic + LE uint64
      # SIG_OFFSET + 64-byte sig over the ELF). The daemon's apply_inject_update
      # reads the trailing block and re-verifies against EMBEDDED_PUBKEY.
      - name: Build signed inject payload
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || {
            echo "release: SIGNING_KEY secret is empty; set it before tagging a release" >&2
            exit 1
          }
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY" > "$keyfile"
          make sign-elf \
            BINARY=daemon/target/aarch64-linux-android/release/voboost-inject \
            KEY="$keyfile" OUT=build/voboost-inject
          rm -f "$keyfile"

      # Stage the release artifacts into a clean directory (ci-release): the
      # signed inject payload (daemon ELF) AND the per-ABI native payload files
      # (libimplant.so, liblsplant.so, liblsplt.so, libdobby.a). The raw build
      # objects (daemon/target, implant/libs) are intermediates, not published.
      - name: Stage release artifacts
        run: |
          mkdir -p dist/payload/arm64-v8a dist/payload/armeabi-v7a
          cp build/voboost-inject dist/
          # Per-ABI payload files built by make build-implant (implant/libs).
          for abi in arm64-v8a armeabi-v7a; do
            for f in libimplant.so liblsplant.so liblsplt.so libdobby.a; do
              src="implant/libs/$abi/$f"
              [ -f "$src" ] || src="prebuilt/$abi/$f"
              cp "$src" "dist/payload/$abi/$f"
            done
          done

      # Generate the OTA release manifest from the clean staging dir; ci signs
      # and publishes it below. The version was validated up front; re-read it
      # here (each step is a fresh shell).
      - name: Generate release manifest
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          make release-manifest DIR=dist CHANNEL=inject VERSION="$version"

      # Sign the OTA release manifest with the ed25519 private key from CI
      # secrets (ci-signing task 2.1). Signing the manifest transitively
      # authenticates every listed file via its in-manifest sha256. The private
      # key is written to a temp file (umask 077); the trap removes it even on
      # failure. Never echoed. Non-release builds never reach this step.
      - name: Sign and verify release manifest
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || {
            echo "release: SIGNING_KEY secret is empty; set it before tagging a release" >&2
            exit 1
          }
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY" > "$keyfile"
          make sign       KEY="$keyfile"               FILE=build/release-manifest.json
          make verify-sig KEY=config/release-public.pem FILE=build/release-manifest.json
          rm -f "$keyfile"

      # Publish the signed inject payload (daemon ELF), the per-ABI payload
      # files, the signed OTA release manifest, and its .sig (ci-release). The
      # raw build objects are not published. if-no-files-found: error ensures
      # nothing is published if any earlier step failed to produce its output.
      - name: Publish signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voboost-inject-${{ github.ref_name }}
          path: |
            build/voboost-inject
            dist/payload/
            build/release-manifest.json
            build/release-manifest.json.sig
          if-no-files-found: error

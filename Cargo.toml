[workspace]
resolver = "2"
members = [
    "contract",
    "cluster/native",
    "daemon",
    "uninstall",
    "install",
    "restore",
    "shared",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.voboost-uninstall]
opt-level = "z"
strip = true
